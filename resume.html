<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Saurav Kumar — Resume</title>

    <!-- Bootstrap 5 (CDN) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
                              :root{
                                --brand: #E65168;   /* unchanged */
                                --topbar-h: 44px;   /* slim topbar */
                                --btn-h: 30px;
                              }

                              /* lock body scrolling so only iframe scrolls */
                              html,body{ height:100%; margin:0; }
                              body { background:#1e1e1e; color:#fff; overflow:hidden; font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing:antialiased; }

                              /* navbar */
                              .navbar-custom {
                                background: var(--brand);
                                height: var(--topbar-h);
                                padding: .25rem 1rem;
                                box-shadow: 0 2px 6px rgba(0,0,0,.22);
                                z-index: 1040;
                                display:flex;
                                align-items:center;
                              }
                              .navbar-brand { color:#fff; font-weight:700; font-size:13px; text-decoration:none; }

                              /* desktop actions: pills */
                              .nav-action {
                                height: var(--btn-h);
                                padding: 0 12px;
                                font-size:12px;
                                border-radius:999px;
                                font-weight:700;
                                display:inline-flex;
                                align-items:center;
                                justify-content:center;
                                text-decoration:none;
                                color: var(--brand);
                                background: #fff;
                                border: 0;
                                box-shadow: 0 3px 10px rgba(0,0,0,0.18);
                              }
                              .nav-action:hover{ background:#f2f2f2; transform:translateY(-1px); }

                              /* mobile toggler should look like a pill (matching action style) */
                     .navbar-toggler.pill-toggler {
              display:inline-flex;
              align-items:center;
              justify-content:center;
              width:40px;
              height:36px;
              padding:0;
              border-radius:6px;
              background:transparent;
              border:none;
              box-shadow:none;
            }
              /* Paste into your <style> on this page */
      .navbar-toggler.pill-toggler svg,
      .navbar-toggler.pill-toggler svg path,
      .navbar-toggler.pill-toggler svg line {
        stroke: #ffffff !important;   /* force white lines */
        fill: none !important;
        color: #ffffff !important;
        width: 50px;
        height: 16px;
        display: block;
      }


                              .navbar-toggler.pill-toggler:focus { outline: none; box-shadow: 0 0 0 3px rgba(230,81,104,0.12); }

                              /* container: position and sizing so there's no page scroll */
                              main.container {
                                padding-top: var(--topbar-h);
                                height: calc(100vh - var(--topbar-h));
                                display:flex;
                                justify-content:center;
                                box-sizing: border-box;
                              }
                              .paper{
                                width:100%;
                                max-width:980px;
                                height:100%;
                                display:flex;
                                justify-content:center;
                                align-items:flex-start;
                                padding:10px;
                                box-sizing:border-box;
                              }
                              .viewer{
                                width:100%;
                                max-width:880px;
                                height:100%;
                                background:#fff;
                                border-radius:4px;
                                overflow:hidden;
                                box-shadow: 0 8px 24px rgba(0,0,0,0.35);
                              }
                              /* iframe takes full height — inner content scrolls inside iframe only */
                              .viewer iframe{ width:100%; height:100%; border:0; display:block; }

                              /* offcanvas header uses brand background so it visually matches */
                              .offcanvas-header {
                                background: var(--brand);
                                color: #fff;
                              }
                              .offcanvas-title { margin:0; font-weight:700; }

                              /* offcanvas body buttons same look as nav-action */
                              .offcanvas .nav-action {
                                background: #fff;
                                color: var(--brand);
                                width:100%;
                                justify-content:center;
                                margin-bottom:10px;
                              }

                              /* small polish: ensure offcanvas backdrop z-index above navbar */
                              .offcanvas-backdrop { z-index: 1035; }
                              .offcanvas { z-index: 1045; }

                              /* responsive: show the mobile toggler only below md; show desktop actions on md+ */
                              @media (min-width: 768px) {
                                .navbar-toggler.pill-toggler { display:none!important; }  /* hide pill toggler on larger screens */
                                .desktop-actions { display:flex!important; }
                                .mobile-actions { display:none!important; }
                              }
                              @media (max-width: 767.98px) {
                                .desktop-actions { display:none!important; }
                                .navbar-toggler.pill-toggler { display:inline-flex!important; } /* show pill toggler on mobile */
                              }

                              /* small polish: focus styles */
                              a.nav-action:focus, .navbar-toggler:focus { outline: none; box-shadow: 0 0 0 3px rgba(230,81,104,0.12); }
    </style>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-custom" aria-label="Top navigation">
      <div class="container-fluid d-flex align-items-center">
        <a class="navbar-brand" href="/index.html">Saurav Kumar</a>

        <!-- Desktop inline actions (visible md and up) -->
        <div
          class="desktop-actions ms-auto d-none d-md-flex align-items-center gap-2"
        >
          <a class="nav-action" href="/index.html">Back to Home</a>
          <a
            class="nav-action"
            href="https://drive.google.com/file/d/1fNFBBFnnNVPKPqBv_6DBdDo7IealhsRx/view?usp=sharing"
            target="_blank"
            rel="noopener"
            >Open in Drive</a
          >
          <a
            class="nav-action"
            href="https://drive.google.com/uc?export=download&id=1fNFBBFnnNVPKPqBv_6DBdDo7IealhsRx"
            target="_blank"
            rel="noopener"
            >Download</a
          >
        </div>

        <!-- Mobile pill toggler (right) — visible only on small screens -->
        <button
          class="navbar-toggler pill-toggler ms-auto d-md-none"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasActions"
          aria-controls="offcanvasActions"
          aria-label="Open Actions"
        >
          <!-- hamburger icon stroke uses currentColor; set color via SVG stroke -->
          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M3 6h18M3 12h18M3 18h18"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>
    </nav>

    <!-- right-side offcanvas (slides in from right) -->
    <div
      class="offcanvas offcanvas-end"
      tabindex="-1"
      id="offcanvasActions"
      aria-labelledby="offcanvasActionsLabel"
    >
      <div class="offcanvas-header">
        <button
          type="button"
          class="btn-close btn-close-white text-reset"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body d-flex flex-column align-items-stretch">
        <a class="nav-action" href="/index.html">Back to Home</a>
        <a
          class="nav-action"
          href="https://drive.google.com/file/d/1fNFBBFnnNVPKPqBv_6DBdDo7IealhsRx/view?usp=sharing"
          target="_blank"
          rel="noopener"
          >Open in Drive</a
        >
        <a
          class="nav-action"
          href="https://drive.google.com/uc?export=download&id=1fNFBBFnnNVPKPqBv_6DBdDo7IealhsRx"
          target="_blank"
          rel="noopener"
          >Download</a
        >
      </div>
    </div>

    <!-- MAIN: iframe scrolls, page locked -->
    <main class="container" role="main">
      <div class="paper" role="document" aria-label="Resume preview area">
        <div class="viewer" aria-hidden="false">
          <iframe
            src="https://drive.google.com/file/d/1fNFBBFnnNVPKPqBv_6DBdDo7IealhsRx/preview"
            title="Resume preview"
          ></iframe>
        </div>
      </div>
    </main>

    <!-- Bootstrap bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // ensure SVG uses brand color inside pill toggler
      document.addEventListener('DOMContentLoaded', () => {
        const pills = document.querySelectorAll('.pill-toggler');
        pills.forEach(p => p.querySelector('svg')?.setAttribute('style','color:'+getComputedStyle(document.documentElement).getPropertyValue('--brand')));
      });

      // accessibility: when offcanvas closes, return focus to toggler
      const offcanvasEl = document.getElementById('offcanvasActions');
      offcanvasEl?.addEventListener('hidden.bs.offcanvas', () => {
        document.querySelector('.pill-toggler')?.focus();
      });
    </script>
  </body>
</html>
